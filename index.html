<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Roommate</title>
</head>
<body>
  <h1 id="title">Find Your Roommate Form</h1>
  <p id="description">Fill out the form below to help us find your ideal roommate. Please provide accurate information to ensure the best match.</p>
  <form id="survey-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>
    <br>
    <label for="email">Email</label>
    <input type="email" name="email" placeholder="Enter your Email" required>
    <br>
  </form>
</body>
</html>
