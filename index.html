<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Roommate</title>
</head>
<body>
  <h1 id="title">Find Your Roommate</h1>
  <p id="description">Fill out the form below to help us find your ideal roommate. Please provide accurate information to ensure the best match.</p>
  <form id="survey-form">
    <div class="form-group">
      <label for="name" id="name-label">Name</label>
      <input type="text" id="name" name="name" placeholder="*" required>  
    </div>

    <div class="form-group">
      <label for="surname" id="surname-label">Surname</label>
      <input type="text" id="surname" name="surname" placeholder="*" required>  
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="16" max="100" placeholder="*" required> 
    </div>

    <fieldset class="form-group">
      <legend>Gender</legend>

      <label for="male" id="male-label">
          <input type="radio" name="gender" id="male" value="male" required>
          Male
      </label>

      <label for="female" id="female-label">
          <input type="radio" name="gender" id="female" value="female">
          Female
      </label>

      <label for="other" id="other-label">
          <input type="radio" name="gender" id="other" value="other">
          Other
      </label>
    </fieldset>

    <div class="form-group">
      <label for="city" id="city-label">City</label>
      <input type="text" id="city" name="city" placeholder="*" required>  
    </div>

    <div class="form-group">
      <label for="district" id="district-label">Preferred district</label>
      <input type="text" id="district" name="district" placeholder="Optional">  
    </div>

    <div class="form-group">
      <label for="dropdown" id="dropdown-label">Which option describes your situation the best?</label>
      <select id="dropdown" name="dropdown">
        <option value="looking">Im not renting yet and will search for an apartment with a roommate</option>
        <option value="renting">I'm already renting and have extra room</option>
      </select>
    </div>

    <div class="form-group">
      <label for="number" id="number-label">What number of roommates are you ready to share an apartment with?</label>
      <input type="number" name="number" id="number" placeholder="Optional" min="1" max="100000"></input>
    </div>

    <fieldset class="form-group">
      <legend>Which pets are you comfortable living with?</legend>

      <label>
        <input type="checkbox" name="pets" value="dog">
        Dogs
      </label>

      <label>
        <input type="checkbox" name="pets" value="cat">
        Cats
      </label>

      <label>
        <input type="checkbox" name="pets" value="small">
        Small pets
      </label>

      <label>
        <input type="checkbox" name="pets" value="no-pet">
        No pets
      </label>
    </fieldset>

    <div class="form-group">
      <label for="bio" id="bio-label">Share more about yourself and who you want to live with</label>
      <textarea name="bio" id="bio" placeholder="Optional"></textarea>
    </div>

    <div class="form-group">
      <label for="email" id="email-label">Email</label>
      <input type="email" id="email" name="email" placeholder="*" required>
    </div>
    
    <div class="form-group">
      <label for="number" id="tel-label">Phone number</label>
      <input type="tel" id="tel" name="tel" placeholder="*" required>
    </div>
    
    <button id="submit">Submit form</button>
  </form>
</body>
</html>
